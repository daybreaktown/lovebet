<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>per Betty</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;600;700&family=Share+Tech+Mono&family=Playfair+Display:ital,wght@1,400;1,700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #03020a; --neon-pink: #ff2d78; --neon-cyan: #00f5d4; --neon-yellow: #f5e642;
    --red-thread: #e63946; --text: #f7e8f0; --muted: rgba(255,220,240,0.72);
    --glow-pink: 0 0 8px #ff2d78, 0 0 24px rgba(255,45,120,0.4);
    --glow-cyan: 0 0 8px #00f5d4, 0 0 24px rgba(0,245,212,0.4);
  }
  html, body { height: 100%; overscroll-behavior-y: none; overscroll-behavior-x: none; }
  body { background-color: var(--black); color: var(--text); font-family: 'Rajdhani', sans-serif; touch-action: pan-y; }
  body::before { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px); pointer-events:none; z-index:500; }
  body::after { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(0,245,212,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,212,0.04) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }

  /* GATE */
  #gate { position:fixed; inset:0; background:var(--black); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 24px; transition:opacity 0.8s ease; }
  body.gate-active { overflow:hidden; }
  #gate.unlocking { opacity:0; pointer-events:none; }
  .gate-label { font-family:'Share Tech Mono',monospace; font-size:12px; letter-spacing:0.15em; color:var(--neon-pink); text-shadow:var(--glow-pink); margin-bottom:48px; width:100%; text-align:center; }
  .gate-input-row { display:flex; gap:12px; margin-bottom:40px; justify-content:center; width:100%; opacity:0; transition:opacity 0.8s ease; }
  .gate-digit { width:44px; height:56px; background:transparent; border:none; border-bottom:1px solid rgba(255,45,120,0.3); color:var(--neon-pink); font-family:'Playfair Display',serif; font-size:30px; font-style:italic; text-align:center; outline:none; caret-color:var(--neon-pink); transition:border-color 0.3s ease; }
  .gate-digit:focus { border-bottom-color:var(--neon-pink); text-shadow:var(--glow-pink); }
  .gate-digit.filled { border-bottom-color:rgba(255,45,120,0.7); text-shadow:var(--glow-pink); }
  .gate-error { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:0.25em; color:var(--neon-pink); opacity:0; transition:opacity 0.3s ease; margin-top:8px; text-shadow:var(--glow-pink); }
  .gate-error.visible { opacity:1; }
  .gate-hint { font-family:'Cormorant Garamond',serif; font-size:13px; font-style:italic; color:rgba(255,220,240,0.35); margin-top:56px; letter-spacing:0.04em; opacity:0; transition:opacity 0.8s ease; }
  .gate-label .letter, .gate-hint .letter { display:inline-block; opacity:0; transition:opacity 0.3s ease; }
  .gate-label .letter.visible, .gate-hint .letter.visible { opacity:1; }
  .gate-label.glitch-active { animation:labelFlicker 6s infinite; }
  @keyframes labelFlicker {
    0%,88%,100% { opacity:1; text-shadow:var(--glow-pink); }
    89% { opacity:0.4; text-shadow:none; } 90% { opacity:1; text-shadow:var(--glow-pink); }
    91% { opacity:0.2; text-shadow:none; } 92% { opacity:1; text-shadow:0 0 16px #ff2d78,0 0 40px rgba(255,45,120,0.8); }
    93% { opacity:0.8; } 94% { opacity:1; text-shadow:var(--glow-pink); }
    95% { transform:translateX(-3px); filter:hue-rotate(40deg); }
    96% { transform:translateX(3px); filter:hue-rotate(-40deg); }
    97% { transform:translateX(0); filter:none; opacity:0.5; }
    98% { opacity:1; text-shadow:var(--glow-pink); }
  }

  /* RED THREAD — lives inside pages-wrapper, moves with it */
  #thread-svg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:5; overflow:visible; opacity:0; transition:opacity 0.6s ease; }
  #thread-svg.active { opacity:1; }
  .thread-line { fill:none; stroke:var(--red-thread); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 3px var(--red-thread)) drop-shadow(0 0 8px rgba(230,57,70,0.55)); opacity:0.5; }
  .thread-line.idle-flicker { animation:threadFlicker 5.5s ease-in-out infinite; }
  @keyframes threadFlicker { 0%,88%,100%{opacity:0.5;} 90%{opacity:0.25;} 92%{opacity:0.62;} 94%{opacity:0.35;} 96%{opacity:0.5;} }

  /* VIEWPORT / 4 PAGES */
  #viewport { position:fixed; inset:0; overflow:hidden; z-index:1; }
  #pages-wrapper { position:absolute; top:0; left:0; width:100%; height:500%; transform:translateY(0); transition:transform 0.65s cubic-bezier(.22,.8,.36,1); will-change:transform; }
  .page { position:relative; width:100%; height:20%; overflow:hidden; }
  #page1 { overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; scrollbar-width:none; overscroll-behavior-y:contain; }
  #page1::-webkit-scrollbar { display:none; }

  /* FLOWERS */
  #bg-flowers { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .flower { position:absolute; pointer-events:none; z-index:0; opacity:0.12; }
  .flower svg { display:block; width:220px; height:auto; }
  .flower-yellow-tl { top:3%; left:2%; transform:rotate(-20deg); }
  .flower-yellow-tl svg { filter:drop-shadow(0 0 8px var(--neon-yellow)); }
  .flower-pink-c { top:50%; left:50%; transform:translate(-50%,-50%); }
  .flower-pink-c svg { filter:drop-shadow(0 0 8px var(--neon-pink)); }
  .flower-cyan-br { bottom:calc(80px + env(safe-area-inset-bottom,0px)); right:2%; transform:rotate(15deg); }
  .flower-cyan-br svg { filter:drop-shadow(0 0 8px var(--neon-cyan)); }
  @media (max-width:480px) { .flower svg { width:170px; } .flower-yellow-tl { top:2%; left:0; } .flower-cyan-br { right:0; } }
  @media (max-width:380px) { .flower svg { width:150px; } }

  /* CAT */
  #cat-wrap { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); transition:top 1.4s cubic-bezier(.4,0,.2,1),left 1.4s cubic-bezier(.4,0,.2,1),transform 1.4s cubic-bezier(.4,0,.2,1),opacity 0.6s ease; z-index:200; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:12px; -webkit-tap-highlight-color:transparent; user-select:none; }
  #cat-wrap.cat-hidden { opacity:0; pointer-events:none; }
  #cat-wrap.floating { animation:float 4s ease-in-out infinite; }
  #cat-wrap.in-corner { z-index:600; }
  #cat-inner { filter:drop-shadow(0 0 8px var(--neon-cyan)); opacity:0.7; transform-origin:center center; transition:opacity 0.6s ease,filter 0.6s ease; }
  .in-corner #cat-inner { opacity:0.95; filter:drop-shadow(0 0 12px var(--neon-cyan)) drop-shadow(0 0 24px rgba(0,245,212,0.35)); }
  #cat-inner.yawning { animation:catYawn 0.65s ease forwards; }
  #cat-inner.yawning #cat-mouth { opacity:1 !important; }
  @keyframes catYawn { 0%{transform:scale(1) rotate(0);} 20%{transform:scale(1.18) rotate(-6deg);} 45%{transform:scale(1.22) rotate(4deg);} 70%{transform:scale(1.08) rotate(-2deg);} 100%{transform:scale(1) rotate(0);} }
  #boddo-hint { font-family:'Share Tech Mono',monospace; font-size:10px; letter-spacing:0.18em; color:var(--neon-cyan); text-shadow:var(--glow-cyan); text-transform:uppercase; white-space:nowrap; opacity:1; transition:opacity 0.4s ease; }
  #boddo-hint.hidden { display:none; }

  .eyebrow { font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:0.35em; text-transform:uppercase; color:var(--neon-cyan); text-shadow:var(--glow-cyan); margin-bottom:20px; }
  .divider  { width:1px; height:44px; background:linear-gradient(to bottom,transparent,var(--neon-pink),transparent); box-shadow:var(--glow-pink); }

  /* SWIPE HINTS — global, fixed, outside viewport */
  #hintDownGlobal, #hintUpGlobal { position:fixed; left:50%; z-index:400; display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:none; opacity:0; transition:opacity 0.5s ease; transform:translateX(-50%); }
  #hintDownGlobal { bottom:calc(28px + env(safe-area-inset-bottom,0px)); animation:nudgeDownFixed 1.8s ease-in-out infinite; }
  #hintUpGlobal { top:24px; animation:nudgeUpFixed 1.8s ease-in-out infinite; }
  #hintDownGlobal.visible, #hintUpGlobal.visible { opacity:1; }
  @keyframes nudgeDownFixed { 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(5px);} }
  @keyframes nudgeUpFixed   { 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(-5px);} }
  #hintDownGlobal svg, #hintUpGlobal svg { width:18px; height:18px; fill:none; stroke:var(--neon-pink) !important; filter:drop-shadow(0 0 6px var(--neon-pink)); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; color:var(--neon-pink); }
  #hintDownGlobal svg polyline, #hintUpGlobal svg polyline { stroke:var(--neon-pink); }
  #hintDownGlobal .swipe-hint-label, #hintUpGlobal .swipe-hint-label { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:0.22em; color:var(--neon-pink); text-shadow:var(--glow-pink); text-transform:uppercase; opacity:0.7; }

  /* Page-1 hint (the original "swipe" arrow under the dedica) */
  .swipe-hint { position:absolute; left:50%; transform:translateX(-50%); z-index:20; display:flex; flex-direction:column; align-items:center; gap:4px; pointer-events:none; transition:opacity 0.5s ease; }
  .hint-down { bottom:calc(80px + env(safe-area-inset-bottom,0px)); animation:nudgeDown 1.8s ease-in-out infinite; }
  @supports (height:100dvh) { .hint-down { bottom:calc(max(80px,100vh - 100dvh + 32px) + env(safe-area-inset-bottom,0px)); } }
  #hintDown { opacity:0; }
  #hintDown.visible { opacity:1; }
  .swipe-hint svg { width:18px; height:18px; stroke:var(--neon-pink); filter:drop-shadow(0 0 6px var(--neon-pink)); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .swipe-hint-label { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:0.22em; color:var(--neon-pink); text-shadow:var(--glow-pink); text-transform:uppercase; opacity:0.7; }
  @keyframes nudgeDown { 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(5px);} }

  /* PAGE 1 — DEDICA */
  .p1-inner { position:relative; z-index:2; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 32px; }
  @media (max-width:480px) { .p1-inner { padding:0 20px; } }
  .dedica-area { position:relative; z-index:2; width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:20px; text-align:center; flex-shrink:0; }
  #dedica-text { font-family:'Cormorant Garamond',Georgia,serif; font-size:clamp(16px,3.2vw,20px); font-weight:300; font-style:italic; color:#f2d4e8; line-height:1.9; letter-spacing:0.01em; text-align:center; opacity:0; transition:opacity 1.1s ease; width:100%; height:9.5em; display:block; overflow:hidden; }
  #dedica-text.visible { opacity:1; transition:none; }

  .ink-word, .ink-letter { display:inline-block; opacity:0; filter:blur(10px); transform:scale(0.55) translateY(4px); transition:opacity 0.85s cubic-bezier(.2,.7,.3,1),filter 0.85s cubic-bezier(.2,.7,.3,1),transform 0.85s cubic-bezier(.2,.7,.3,1); will-change:opacity,filter,transform; }
  .ink-word.in, .ink-letter.in { opacity:1; filter:blur(0); transform:scale(1) translateY(0); }

  .divider.in-anim { transform:scaleY(0); transform-origin:top; transition:transform 0.8s cubic-bezier(.2,.7,.3,1); }
  .divider.in-anim.in { transform:scaleY(1); }

  #btn-avanti { background:transparent; border:none; box-shadow:none; padding:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px; flex-shrink:0; opacity:0; pointer-events:none; transition:opacity 0.7s ease; -webkit-tap-highlight-color:transparent; outline:none; -webkit-appearance:none; user-select:none; }
  #btn-avanti.visible { opacity:1; pointer-events:auto; }
  #btn-avanti:focus { outline:none; }
  #btn-avanti svg { width:18px; height:18px; stroke:var(--neon-pink); filter:drop-shadow(0 0 6px var(--neon-pink)); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #btn-avanti .btn-label { font-family:'Share Tech Mono',monospace; font-size:9px; letter-spacing:0.22em; color:var(--neon-pink); text-shadow:var(--glow-pink); text-transform:uppercase; opacity:0.7; }

  .glow-pink, .glow-pink-delay, .glow-pink-delay2 { color:#ff2d78; font-style:italic; }
  .glow-pink-delay2 { font-weight:400; }
  .glow-cyan, .glow-cyan-delay, .glow-cyan-delay2 { color:#00f5d4; }
  .glow-yellow, .glow-yellow-delay { color:#f5e642; }
  @keyframes flicker { 0%{opacity:1;} 10%{opacity:0;} 20%{opacity:1;} 30%{opacity:0;} 45%{opacity:1;} 55%{opacity:0;} 65%{opacity:1;} 100%{opacity:1;} }
  .lit { animation:flicker 0.5s ease forwards; }

  /* SONG PAGES — page2, page3 */
  .song-inner { position:relative; z-index:2; height:100%; max-width:680px; margin:0 auto; padding:60px 32px 40px; display:flex; flex-direction:column; justify-content:center; }
  @media (max-width:480px) { .song-inner { padding:48px 20px 32px; } }

  .title { font-family:'Playfair Display',serif; font-size:clamp(56px,15vw,100px); font-weight:700; font-style:italic; line-height:0.9; color:transparent; -webkit-text-stroke:1.5px var(--neon-pink); text-shadow:var(--glow-pink); margin:0; letter-spacing:-0.02em; position:relative; }
  .title::before, .title::after { content:attr(data-text); position:absolute; left:0; right:0; color:transparent; }
  .title::before { -webkit-text-stroke:1.5px var(--neon-cyan); animation:glitch1 4s infinite; top:0; }
  .title::after  { -webkit-text-stroke:1.5px var(--neon-yellow); animation:glitch2 4s infinite; top:0; }

  .title-row { display:flex; align-items:baseline; justify-content:center; gap:14px; margin-bottom:36px; flex-wrap:wrap; }
  .vol-tag { font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:0.22em; text-transform:uppercase; color:var(--neon-pink); text-shadow:var(--glow-pink); border:1px solid rgba(255,45,120,0.4); padding:4px 12px; box-shadow:inset 0 0 8px rgba(255,45,120,0.08); clip-path:polygon(6px 0%,100% 0%,calc(100% - 6px) 100%,0% 100%); white-space:nowrap; transform:translateY(-6px); }

  .track-header { display:flex; align-items:baseline; gap:16px; margin-bottom:20px; }
  .track-num { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--neon-cyan); text-shadow:var(--glow-cyan); letter-spacing:0.1em; }
  .track-title { font-family:'Playfair Display',serif; font-size:clamp(20px,4.5vw,26px); font-style:italic; color:var(--text); letter-spacing:-0.01em; }

  .diamond-wrap { display:flex; gap:6px; align-items:center; margin-left:auto; transform:translateY(2px); }
  .diamond-symbol { width:26px; height:26px; display:flex; align-items:center; justify-content:center; --dm-color:rgba(255,45,120,0.5); --dm-glow:rgba(255,45,120,0.25); }
  .diamond-symbol svg { width:100%; height:100%; transition:filter 0.3s ease; filter:drop-shadow(0 0 4px var(--dm-glow)); }
  .diamond-symbol svg .dm-facet { fill:none; stroke:var(--dm-color); stroke-width:1.2; transition:stroke 0.3s ease,fill 0.3s ease; }
  .diamond-symbol svg .dm-top { fill:var(--dm-color); opacity:0.08; transition:fill 0.3s ease,opacity 0.3s ease; }
  .diamond-symbol.flash svg { filter:drop-shadow(0 0 8px var(--dm-glow)) drop-shadow(0 0 20px var(--dm-glow)); }
  .diamond-symbol.flash svg .dm-facet { stroke-width:1.5; }
  .diamond-symbol.flash svg .dm-top { opacity:0.3; }

  .swirl-wrap { display:flex; gap:6px; align-items:center; margin-left:auto; transform:translateY(2px); }
  .swirl-symbol.flipped svg { transform:rotate(180deg); }
  .swirl-symbol { width:26px; height:26px; display:flex; align-items:center; justify-content:center; --sw-color:rgba(255,45,120,0.55); --sw-glow:rgba(255,45,120,0.3); }
  .swirl-symbol svg { width:100%; height:100%; transition:filter 0.5s ease; filter:drop-shadow(0 0 4px var(--sw-glow)); }
  .swirl-symbol svg .sw-facet { fill:none; stroke:var(--sw-color); stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; transition:stroke 0.3s ease; }
  .swirl-symbol svg .sw-body { fill:var(--sw-color); opacity:0.1; stroke:var(--sw-color); stroke-width:1.2; transition:fill 0.3s ease,opacity 0.3s ease; }
  .swirl-symbol svg .sw-spot { fill:var(--sw-color); opacity:0.55; transition:fill 0.3s ease,opacity 0.3s ease; }
  .swirl-symbol.flash svg { filter:drop-shadow(0 0 8px var(--sw-glow)) drop-shadow(0 0 20px var(--sw-glow)); }
  .swirl-symbol.flash svg .sw-facet { stroke-width:1.6; }
  .swirl-symbol.flash svg .sw-body { opacity:0.3; }
  .swirl-symbol.flash svg .sw-spot { opacity:0.95; }

  .dice-wrap { display:flex; gap:6px; align-items:center; margin-left:auto; }
  .die { width:26px; height:26px; border:1px solid rgba(255,45,120,0.5); box-shadow:0 0 6px rgba(255,45,120,0.3),inset 0 0 6px rgba(255,45,120,0.05); display:flex; align-items:center; justify-content:center; font-family:'Share Tech Mono',monospace; font-size:13px; color:var(--neon-pink); text-shadow:var(--glow-pink); clip-path:polygon(3px 0%,100% 0%,calc(100% - 3px) 100%,0% 100%); background:rgba(255,45,120,0.05); }
  .die.rolling { animation:dieRoll 0.4s cubic-bezier(.34,1.56,.64,1); }
  .die.special { border-color:rgba(0,245,212,0.6); box-shadow:0 0 10px rgba(0,245,212,0.5),inset 0 0 8px rgba(0,245,212,0.1); color:var(--neon-cyan); text-shadow:var(--glow-cyan); background:rgba(0,245,212,0.05); }
  @keyframes dieRoll { 0%{transform:rotate(0) scale(1);} 30%{transform:rotate(-15deg) scale(0.85);} 60%{transform:rotate(10deg) scale(1.1);} 100%{transform:rotate(0) scale(1);} }

  .player { background:linear-gradient(135deg,rgba(255,45,120,0.05),rgba(0,245,212,0.05)); border:1px solid rgba(255,45,120,0.25); border-left:2px solid var(--neon-pink); padding:24px 28px; position:relative; clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px)); margin-bottom:28px; }
  .player::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(to right,var(--neon-pink),transparent); }
  .player-controls { display:flex; align-items:center; gap:20px; }
  .play-btn { width:44px; height:44px; background:transparent; border:1px solid var(--neon-pink); box-shadow:var(--glow-pink); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.2s ease; clip-path:polygon(4px 0%,100% 0%,calc(100% - 4px) 100%,0% 100%); }
  .play-btn:hover { background:rgba(255,45,120,0.2); box-shadow:var(--glow-pink),inset 0 0 16px rgba(255,45,120,0.15); }
  .play-btn svg { width:14px; height:14px; fill:var(--neon-pink); filter:drop-shadow(0 0 4px var(--neon-pink)); margin-left:2px; }
  .play-btn.playing { border-color:var(--neon-cyan); box-shadow:var(--glow-cyan); }
  .play-btn.playing svg { fill:var(--neon-cyan); filter:drop-shadow(0 0 4px var(--neon-cyan)); }
  .play-btn.playing svg.play-icon { display:none; }
  .play-btn:not(.playing) svg.pause-icon { display:none; }
  .progress-area { flex:1; }
  .progress-bar { width:100%; height:2px; background:rgba(232,224,240,0.1); cursor:pointer; position:relative; margin-bottom:10px; padding:10px 0; margin-top:-10px; box-sizing:content-box; touch-action:none; }
  .progress-fill { height:100%; background:linear-gradient(to right,var(--neon-pink),var(--neon-cyan)); box-shadow:0 0 6px var(--neon-pink); width:0%; transition:width 0.1s linear; pointer-events:none; }
  .progress-handle { width:8px; height:8px; background:var(--neon-cyan); box-shadow:var(--glow-cyan); position:absolute; top:50%; transform:translateY(-50%); left:0%; pointer-events:none; opacity:0; transition:opacity 0.2s; }
  .progress-bar:hover .progress-handle { opacity:1; }
  .time-row { display:flex; justify-content:space-between; }
  .time { font-family:'Share Tech Mono',monospace; font-size:11px; color:var(--muted); letter-spacing:0.05em; }
  audio { display:none; }

  .lyrics-card { position:relative; height:200px; background:linear-gradient(145deg,rgba(255,45,120,0.05),rgba(0,245,212,0.05)); border:1px solid rgba(255,45,120,0.28); border-left:2px solid var(--neon-pink); clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px)); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:28px 32px; overflow:hidden; }
  .lyrics-card::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(to right,var(--neon-pink),transparent); }

<script>
// ════ DEDICA ════
const DEDICA = [
  `Ci sono state tanti <span class="glow-pink">momenti</span>, tante versioni, tante <span class="glow-cyan">emozioni diverse</span>, e in fin dei conti volevo solo <span class="glow-yellow">creare qualcosa</span> con quei sentimenti.`,
  `Il mio percorso, la mia <span class="glow-pink">voglia</span>, i miei desideri, il <span class="glow-cyan">dolore</span>, la <span class="glow-yellow">gioia</span>, la speranza e... l'<span class="glow-pink">amore</span>.`,
  `Se anche solo una piccola parte di te volesse <span class="glow-cyan">ascoltare</span>, mi piacerebbe raccontarti una <span class="glow-yellow">storia</span>.`,
  `Una storia che parla di <span class="glow-cyan">te, di me, di noi</span>, nel passato, nel <span class="glow-pink">futuro</span>, qui e ora, ma anche ovunque e in <span class="glow-yellow">mille dimensioni lontane</span>.`,
  `E di una <span class="glow-pink">scommessa</span>.<br><span class="glow-yellow" style="font-size:clamp(20px,5vw,26px);">La mia...</span>`
];
const TOTAL = DEDICA.length;
const dedicaEl  = document.getElementById('dedica-text');
const btnAvanti = document.getElementById('btn-avanti');
const hintDown  = document.getElementById('hintDown');
let slide = 0;
let changing = false;

// ════ RED THREAD — dual symmetric threads spanning all 4 pages ════
const threadSvg   = document.getElementById('thread-svg');
const threadLeft  = document.getElementById('thread-left');
const threadRight = document.getElementById('thread-right');

const SEG_DURATIONS = [15, 15, 15, 15, 5.5]; // landing, song1, song2, song3, finale+bow
let segProgress = [0, 0, 0, 0, 0];
let threadLengthLeft = 0, threadLengthRight = 0;
let threadActive = false;
let currentProgress = 0;
let threadPageReached = -1;

function buildThreadPath() {
  const w = window.innerWidth, h = window.innerHeight;
  const H = h * 5;
  threadSvg.setAttribute('viewBox', `0 0 ${w} ${H}`);
  threadSvg.setAttribute('width', w);
  threadSvg.setAttribute('height', H);

  const inset = 6;
  const cx = w / 2;
  const knotX = w / 2, knotY = h * 4.75;
  const r = 22;

  // ── LEFT THREAD ──
  const L1 = `M ${cx} ${inset} L ${inset} ${inset} L ${inset} ${h}`;
  const L2 = ` L ${inset} ${h*2}`;
  const L3 = ` L ${inset} ${h*3}`;
  const L4 = ` L ${inset} ${h*4}`;
  const L5approach = ` C ${inset} ${h*4.45}, ${knotX - w*0.25} ${knotY - 40}, ${knotX} ${knotY}`;
  const L5lobe = ` C ${knotX - r*2.5} ${knotY - r*1.8}, ${knotX - r*0.3} ${knotY - r*1.5}, ${knotX} ${knotY}`;
  const leftD = L1 + L2 + L3 + L4 + L5approach + L5lobe;
  threadLeft.setAttribute('d', leftD);
  threadLengthLeft = threadLeft.getTotalLength();
  threadLeft.style.strokeDasharray = threadLengthLeft;

  // ── RIGHT THREAD (mirror) ──
  const R1 = `M ${cx} ${inset} L ${w - inset} ${inset} L ${w - inset} ${h}`;
  const R2 = ` L ${w - inset} ${h*2}`;
  const R3 = ` L ${w - inset} ${h*3}`;
  const R4 = ` L ${w - inset} ${h*4}`;
  const R5approach = ` C ${w - inset} ${h*4.45}, ${knotX + w*0.25} ${knotY - 40}, ${knotX} ${knotY}`;
  const R5lobe = ` C ${knotX + r*2.5} ${knotY - r*1.8}, ${knotX + r*0.3} ${knotY - r*1.5}, ${knotX} ${knotY}`;
  const rightD = R1 + R2 + R3 + R4 + R5approach + R5lobe;
  threadRight.setAttribute('d', rightD);
  threadLengthRight = threadRight.getTotalLength();
  threadRight.style.strokeDasharray = threadLengthRight;

  const measure = (d) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    threadSvg.appendChild(p);
    const len = p.getTotalLength();
    threadSvg.removeChild(p);
    return len;
  };
  const lenL1 = measure(L1);
  const lenL2 = measure(L1 + L2);
  const lenL3 = measure(L1 + L2 + L3);
  const lenL4 = measure(L1 + L2 + L3 + L4);
  segProgress = [
    lenL1 / threadLengthLeft,
    lenL2 / threadLengthLeft,
    lenL3 / threadLengthLeft,
    lenL4 / threadLengthLeft,
    1
  ];

  setThreadOffset(currentProgress);
}

function setThreadOffset(ratio) {
  currentProgress = ratio;
  threadLeft.style.strokeDashoffset  = threadLengthLeft  * (1 - ratio);
  threadRight.style.strokeDashoffset = threadLengthRight * (1 - ratio);
}

// Pure JS rAF animation — reliable, independent of CSS transitions
let threadAnimRAF = null;
let threadAnimStart = null;
let threadAnimFrom = 0;
let threadAnimTo = 0;
let threadAnimDurationMs = 0;

function stopThreadAnimation() {
  if (threadAnimRAF !== null) { cancelAnimationFrame(threadAnimRAF); threadAnimRAF = null; }
  threadAnimStart = null;
}

function threadAnimStep(ts) {
  if (threadAnimStart === null) threadAnimStart = ts;
  const elapsed = ts - threadAnimStart;
  const t = Math.min(elapsed / threadAnimDurationMs, 1);
  const ratio = threadAnimFrom + (threadAnimTo - threadAnimFrom) * t;
  setThreadOffset(ratio);
  if (t < 1) threadAnimRAF = requestAnimationFrame(threadAnimStep);
  else threadAnimRAF = null;
}

function animateThreadTo(targetRatio, durationSec) {
  stopThreadAnimation();
  threadAnimFrom = currentProgress;
  threadAnimTo = targetRatio;
  threadAnimDurationMs = durationSec * 1000;
  threadAnimRAF = requestAnimationFrame(threadAnimStep);
}

function setIdleFlicker(on) {
  if (on) { threadLeft.classList.add('idle-flicker'); threadRight.classList.add('idle-flicker'); }
  else { threadLeft.classList.remove('idle-flicker'); threadRight.classList.remove('idle-flicker'); }
}

function startRedThread() {
  if (threadActive) { threadSvg.classList.add('active'); return; }
  threadActive = true;
  buildThreadPath();
  setThreadOffset(0);
  threadSvg.classList.add('active');
  threadPageReached = 0;
  setIdleFlicker(true);
  animateThreadTo(segProgress[0], SEG_DURATIONS[0]);
}

function rebuildThreadOnResize() {
  if (!threadActive) return;
  buildThreadPath();
}

function advanceThreadTo(page) {
  if (!threadActive) return;
  if (page > threadPageReached) {
    // FORWARD — snap previous segment to completion, then animate new
    stopThreadAnimation();
    setThreadOffset(segProgress[threadPageReached]);
    threadPageReached = page;
    animateThreadTo(segProgress[page], SEG_DURATIONS[page]);
  } else {
    // BACKWARD (or same) — cancel, snap to highest reached
    stopThreadAnimation();
    setThreadOffset(segProgress[threadPageReached]);
  }
}

// ════ CAT INTRO ════
const catWrap = document.getElementById('cat-wrap');
const catInner = document.getElementById('cat-inner');
const boddoHint = document.getElementById('boddo-hint');
const p1Header = document.getElementById('p1-header');
let catMoved = false, catBusy = false;

function triggerYawn(cb) {
  if (catBusy) return;
  catBusy = true;
  catInner.classList.remove('yawning');
  void catInner.offsetWidth;
  catInner.classList.add('yawning');
  setTimeout(() => { catInner.classList.remove('yawning'); catBusy = false; if (cb) cb(); }, 680);
}

catWrap.addEventListener('click', () => {
  if (catWrap.classList.contains('cat-hidden')) return;
  if (!catMoved) {
    catMoved = true;
    boddoHint.classList.add('hidden');
    triggerYawn(() => {
      catWrap.classList.add('in-corner');
      catWrap.style.top = '16px';
      catWrap.style.left = (window.innerWidth - 52 - 16) + 'px';
      catWrap.style.transform = 'translate(0, 0)';
      setTimeout(() => catWrap.classList.add('floating'), 1500);
      setTimeout(() => {
        startRedThread();
        revealHeader();
        setTimeout(() => applySlide(0, false), 1500);
      }, 1500);
    });
  } else {
    triggerYawn();
  }
});

function wrapWords(root) {
  const walk = (node) => {
    const children = Array.from(node.childNodes);
    children.forEach(child => {
      if (child.nodeType === Node.TEXT_NODE) {
        const text = child.textContent;
        if (!text) return;
        const parts = text.split(/(\s+)/);
        const frag = document.createDocumentFragment();
        parts.forEach(part => {
          if (!part) return;
          if (/\s/.test(part)) frag.appendChild(document.createTextNode(part));
          else { const span = document.createElement('span'); span.className = 'ink-word'; span.textContent = part; frag.appendChild(span); }
        });
        node.replaceChild(frag, child);
      } else if (child.nodeType === Node.ELEMENT_NODE) walk(child);
    });
  };
  walk(root);
  return root.querySelectorAll('.ink-word');
}

function revealHeader() {
  const eyebrow = p1Header.querySelector('.eyebrow');
  const divider = p1Header.querySelector('.divider');
  if (!eyebrow.dataset.inked) {
    const text = eyebrow.textContent;
    eyebrow.innerHTML = '';
    text.split('').forEach(ch => {
      const span = document.createElement('span');
      span.className = 'ink-letter';
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      eyebrow.appendChild(span);
    });
    eyebrow.dataset.inked = '1';
  }
  divider.classList.add('in-anim');
  p1Header.style.opacity = '1';
  const letters = eyebrow.querySelectorAll('.ink-letter');
  letters.forEach((l, i) => setTimeout(() => l.classList.add('in'), 100 + i * 90));
  setTimeout(() => divider.classList.add('in'), 100 + letters.length * 90 + 80);
}

function applySlide(idx, skipFade) {
  const isLast = idx === TOTAL - 1;
  dedicaEl.classList.remove('visible');
  dedicaEl.innerHTML = DEDICA[idx];
  const words = wrapWords(dedicaEl);
  requestAnimationFrame(() => {
    dedicaEl.classList.add('visible');
    rehookFlicker();
    words.forEach((w, i) => setTimeout(() => w.classList.add('in'), i * 35));
    const totalRevealMs = words.length * 35 + 700;
    if (!isLast) setTimeout(() => btnAvanti.classList.add('visible'), Math.max(0, totalRevealMs - 200));
    else setTimeout(() => hintDown.classList.add('visible'), Math.max(0, totalRevealMs - 200));
    setTimeout(() => { changing = false; }, totalRevealMs);
  });
}

function nextSlide() {
  if (changing || slide >= TOTAL - 1) return;
  changing = true;
  dedicaEl.classList.remove('visible');
  btnAvanti.classList.remove('visible');
  hintDown.classList.remove('visible');
  setTimeout(() => { slide++; applySlide(slide, false); }, 1150);
}
btnAvanti.addEventListener('click', nextSlide);

// ════ GATE ════
const labelEl = document.getElementById('gate-label');
const labelText = '10 · 13 · 20 · 5 · 2 · 5 · 18';
const labelChars = labelText.split('').map(char => {
  const s = document.createElement('span'); s.className = 'letter'; s.textContent = char === ' ' ? '\u00A0' : char; labelEl.appendChild(s); return s;
});
const li = labelChars.map((_, i) => i);
for (let i = li.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [li[i], li[j]] = [li[j], li[i]]; }
const tDelay = labelChars.length * 110 + 400;
li.forEach((ci, order) => { setTimeout(() => { labelChars[ci].classList.add('visible'); }, 400 + order * 110); });
setTimeout(() => {
  labelEl.classList.add('glitch-active');
  document.querySelector('.gate-input-row').style.opacity = '1';
  document.getElementById('gate-hint').style.opacity = '1';
  setTimeout(() => digits[0].focus(), 400);
}, tDelay + 200);
document.getElementById('gate-hint').textContent = '運命の赤い糸';

const PASSWORD = '3110';
const gate = document.getElementById('gate');
const digits = [document.getElementById('d1'), document.getElementById('d2'), document.getElementById('d3'), document.getElementById('d4')];
const errorEl = document.getElementById('gate-error');

digits.forEach((input, i) => {
  input.addEventListener('input', e => {
    const v = e.target.value.replace(/\D/g, '');
    input.value = v ? v[v.length - 1] : '';
    if (input.value) { input.classList.add('filled'); if (i < digits.length - 1) digits[i + 1].focus(); else checkPassword(); }
    else input.classList.remove('filled');
    errorEl.classList.remove('visible');
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !input.value && i > 0) { digits[i - 1].value = ''; digits[i - 1].classList.remove('filled'); digits[i - 1].focus(); }
  });
});

function checkPassword() {
  const entered = digits.map(d => d.value).join('');
  if (entered === PASSWORD) {
    gate.classList.add('unlocking');
    startFlicker();
    initAudioGraph();
    setTimeout(() => { gate.style.display = 'none'; document.body.classList.remove('gate-active'); }, 800);
  } else {
    errorEl.classList.add('visible');
    digits.forEach(d => { d.value = ''; d.classList.remove('filled'); });
    setTimeout(() => digits[0].focus(), 100);
  }
}

// ════ PAGE NAVIGATION ════
const pagesWrapper = document.getElementById('pages-wrapper');
const page1El = document.getElementById('page1');
const hintUpGlobal = document.getElementById('hintUpGlobal');
const hintDownGlobal = document.getElementById('hintDownGlobal');
let currentPage = 0;
let transitioning = false;

// Stricter swipe thresholds — voluntary, deliberate swipes only
const SWIPE_DIST = 110;
const SWIPE_RATIO = 2.2;
const WHEEL_COOLDOWN = 1100;
const TOUCH_COOLDOWN = 900;
let lastNavTime = 0;

function canSwipeDown() { return slide === TOTAL - 1; }

// Allowed transitions:
// 0 -> 1 (gated by canSwipeDown)
// 1 -> 2  (free)
// 2 -> 1, 2 -> 3 (free)
// 3 -> 2 (free)
// 1 -> 0 BLOCKED FOREVER
function canGoTo(target) {
  if (target < 0 || target > 4) return false;
  if (target === currentPage) return false;
  if (Math.abs(target - currentPage) !== 1) return false; // only adjacent
  // Block 1 -> 0
  if (currentPage === 1 && target === 0) return false;
  // Page 0 -> 1 requires dedica complete
  if (currentPage === 0 && target === 1 && !canSwipeDown()) return false;
  return true;
}

function updatePageHints() {
  hintUpGlobal.classList.remove('visible');
  hintDownGlobal.classList.remove('visible');
  if (currentPage === 0) return; // page 1 has its own hintDown
  if (currentPage === 1) {
    // Only swipe down available
    hintDownGlobal.classList.add('visible');
  } else if (currentPage === 2) {
    hintUpGlobal.classList.add('visible');
    hintDownGlobal.classList.add('visible');
  } else if (currentPage === 3) {
    hintUpGlobal.classList.add('visible');
    hintDownGlobal.classList.add('visible');
  } else if (currentPage === 4) {
    hintUpGlobal.classList.add('visible');
  }
}

function setCatVisible(visible) {
  if (visible) catWrap.classList.remove('cat-hidden');
  else catWrap.classList.add('cat-hidden');
}

function goToPage(idx) {
  if (transitioning) return;
  if (!canGoTo(idx)) return;
  transitioning = true;
  lastNavTime = Date.now();
  const prev = currentPage;
  currentPage = idx;
  pagesWrapper.style.transform = `translateY(-${idx * 20}%)`;

  // Cat visibility — always visible once it's in the corner; hidden only when lyrics overlay is open
  setCatVisible(lyricsViewSong === null);

  // Red thread — always visible, advances on each new page
  advanceThreadTo(idx);

  // Audio handling
  if (idx === 1) { setTimeout(() => playSong(1), 400); }
  else if (idx === 2) { setTimeout(() => playSong(2), 400); }
  else if (idx === 3) { setTimeout(() => playSong(3), 400); }
  else { stopAllAudio(); }

  // Page 5 (finale) reveal
  if (idx === 4) {
    setTimeout(revealFinale, 400);
  } else if (prev === 4) {
    resetFinale();
  }

  setTimeout(updatePageHints, 50);
  setTimeout(() => { transitioning = false; }, 700);
}

// ════ FINALE PAGE ════
const finaleLine = document.getElementById('finaleLine');
const finaleText = document.getElementById('finale-text');
const finaleSign = document.getElementById('finale-sign');
const FINALE_TEXT = `I hope you'll be my Valentine forever!`;
const SIGN_TEXT = `DA MATTIA`;
let finaleInked = false;
let finaleTimeouts = []; // pending setTimeout ids — cleared on reset to prevent stale animations

function resetFinale() {
  // Cancel any pending animation timeouts from a previous reveal
  finaleTimeouts.forEach(id => clearTimeout(id));
  finaleTimeouts = [];
  finaleLine.classList.remove('in');
  if (finaleInked) {
    finaleText.querySelectorAll('.ink-word').forEach(w => w.classList.remove('in'));
    finaleSign.querySelectorAll('.ink-letter').forEach(l => l.classList.remove('in'));
  }
}

function revealFinale() {
  // Build text on first reveal
  if (!finaleInked) {
    finaleText.textContent = FINALE_TEXT;
    wrapWords(finaleText);
    const text = SIGN_TEXT;
    finaleSign.innerHTML = '';
    text.split('').forEach(ch => {
      const span = document.createElement('span');
      span.className = 'ink-letter';
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      finaleSign.appendChild(span);
    });
    finaleInked = true;
  } else {
    // Re-reveal — ensure clean state (resetFinale should have already cleared timeouts)
    finaleText.querySelectorAll('.ink-word').forEach(w => w.classList.remove('in'));
    finaleSign.querySelectorAll('.ink-letter').forEach(l => l.classList.remove('in'));
  }
  // Schedule animations and TRACK each timeout id so resetFinale can cancel them
  finaleTimeouts.push(setTimeout(() => finaleLine.classList.add('in'), 100));
  const words = finaleText.querySelectorAll('.ink-word');
  words.forEach((w, i) => {
    finaleTimeouts.push(setTimeout(() => w.classList.add('in'), 600 + i * 60));
  });
  const letters = finaleSign.querySelectorAll('.ink-letter');
  const letterStart = 600 + words.length * 60 + 200;
  letters.forEach((l, i) => {
    finaleTimeouts.push(setTimeout(() => l.classList.add('in'), letterStart + i * 90));
  });
}

// ════ KEYBOARD ════
document.addEventListener('keydown', e => {
  if (gate.style.display !== 'none' && !gate.classList.contains('unlocking')) return;
  if (typeof lyricsViewSong !== 'undefined' && lyricsViewSong !== null) {
    if (e.key === 'Escape') closeLyricsView();
    return;
  }
  if (currentPage === 0) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      if (slide < TOTAL - 1) nextSlide();
      else goToPage(1);
    }
  } else {
    if (e.key === 'ArrowDown') goToPage(currentPage + 1);
    if (e.key === 'ArrowUp') goToPage(currentPage - 1);
  }
});

// ════ WHEEL ════
let wCool = false;
document.addEventListener('wheel', e => {
  if (typeof lyricsViewSong !== 'undefined' && lyricsViewSong !== null) return;
  if (wCool || transitioning) return;
  if (currentPage === 0) {
    if (e.deltaY > 0 && canSwipeDown()) goToPage(1); else return;
  } else {
    if (e.deltaY > 0) goToPage(currentPage + 1);
    else if (e.deltaY < 0) goToPage(currentPage - 1);
    else return;
  }
  wCool = true; setTimeout(() => { wCool = false; }, WHEEL_COOLDOWN);
}, { passive: true });

// ════ TOUCH ════
let tX = 0, tY = 0, tOn = false, tVert = null;
document.addEventListener('touchstart', e => {
  if (typeof lyricsViewSong !== 'undefined' && lyricsViewSong !== null) { tOn = false; return; }
  if (e.target.closest && e.target.closest('.progress-bar')) { tOn = false; return; }
  tX = e.touches[0].clientX; tY = e.touches[0].clientY; tOn = true; tVert = null;
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!tOn) return;
  const dx = e.touches[0].clientX - tX, dy = e.touches[0].clientY - tY;
  if (tVert === null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) tVert = Math.abs(dy) > Math.abs(dx);
}, { passive: true });
document.addEventListener('touchend', e => {
  if (typeof lyricsViewSong !== 'undefined' && lyricsViewSong !== null) { tOn = false; return; }
  if (!tOn || tVert === null) { tOn = false; return; }
  const dx = e.changedTouches[0].clientX - tX, dy = e.changedTouches[0].clientY - tY;
  tOn = false;
  if (!tVert) return; // horizontal swipes do nothing now
  if (Math.abs(dy) < SWIPE_DIST) return;
  if (Math.abs(dy) / (Math.abs(dx) + 1) < SWIPE_RATIO) return;
  if (Date.now() - lastNavTime < TOUCH_COOLDOWN) return;
  if (currentPage === 0) {
    if (dy < 0 && canSwipeDown()) goToPage(1);
  } else {
    if (dy < 0) goToPage(currentPage + 1);
    else if (dy > 0) goToPage(currentPage - 1);
  }
}, { passive: true });

// ════ FLICKER ════
let flickerTimer = null, glowQ = [];
function getGlowEls() { return Array.from(document.querySelectorAll('.glow-pink,.glow-pink-delay,.glow-pink-delay2,.glow-cyan,.glow-cyan-delay,.glow-cyan-delay2,.glow-yellow,.glow-yellow-delay')); }
function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }
function cycleGlow() {
  if (glowQ.length === 0) glowQ = shuffle(getGlowEls());
  const el = glowQ.pop(); if (!el) return;
  el.classList.remove('lit'); void el.offsetWidth; el.classList.add('lit');
}
function startFlicker() { glowQ = shuffle(getGlowEls()); if (!flickerTimer) flickerTimer = setInterval(cycleGlow, 400); cycleGlow(); }
function rehookFlicker() { glowQ = shuffle(getGlowEls()); }

// ════ AUDIO ════
const audios = { 1: document.getElementById('audio1'), 2: document.getElementById('audio2'), 3: document.getElementById('audio3') };
let current = null;

function fmt(s) { if (isNaN(s)) return '—:——'; return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`; }

function stopAllAudio() {
  [1, 2, 3].forEach(n => {
    audios[n].pause();
    document.querySelector(`#player${n} .play-btn`).classList.remove('playing');
  });
  current = null;
}

function playSong(n) {
  ensureAudioRunning().then(() => {
    // Pause all others
    [1, 2, 3].forEach(k => {
      if (k !== n) {
        audios[k].pause();
        audios[k].currentTime = 0;
        document.querySelector(`#player${k} .play-btn`).classList.remove('playing');
      }
    });
    // Reset & play target
    const a = audios[n];
    const btn = document.querySelector(`#player${n} .play-btn`);
    a.currentTime = 0;
    a.play().then(() => { btn.classList.add('playing'); current = n; }).catch(() => {});
  });
}

function togglePlay(n) {
  const a = audios[n], b = document.querySelector(`#player${n} .play-btn`);
  if (current && current !== n) { audios[current].pause(); document.querySelector(`#player${current} .play-btn`).classList.remove('playing'); }
  if (a.paused) {
    ensureAudioRunning().then(() => { a.play(); b.classList.add('playing'); current = n; });
  } else { a.pause(); b.classList.remove('playing'); current = null; }
}

[1, 2, 3].forEach(n => {
  const bar = document.getElementById(`bar${n}`), a = audios[n];
  let sk = false;
  const st = cx => { const r = bar.getBoundingClientRect(); if (a.duration) a.currentTime = Math.min(Math.max((cx - r.left) / r.width, 0), 1) * a.duration; };
  bar.addEventListener('pointerdown', e => { sk = true; bar.setPointerCapture(e.pointerId); bar.style.cursor = 'grabbing'; document.getElementById(`handle${n}`).style.opacity = '1'; st(e.clientX); });
  bar.addEventListener('pointermove', e => { if (sk) st(e.clientX); });
  bar.addEventListener('pointerup', e => { if (!sk) return; sk = false; bar.style.cursor = ''; document.getElementById(`handle${n}`).style.opacity = ''; st(e.clientX); });
  bar.addEventListener('pointercancel', () => { sk = false; bar.style.cursor = ''; document.getElementById(`handle${n}`).style.opacity = ''; });
});

[1, 2, 3].forEach(n => {
  const a = audios[n];
  a.addEventListener('timeupdate', () => {
    const p = a.duration ? (a.currentTime / a.duration) * 100 : 0;
    document.getElementById(`fill${n}`).style.width = p + '%';
    document.getElementById(`handle${n}`).style.left = p + '%';
    document.getElementById(`cur${n}`).textContent = fmt(a.currentTime);
    if (lyricsViewSong === n) syncLyricsViewPlayer();
  });
  a.addEventListener('loadedmetadata', () => { document.getElementById(`dur${n}`).textContent = fmt(a.duration); if (lyricsViewSong === n) syncLyricsViewPlayer(); });
  a.addEventListener('play',  () => { if (lyricsViewSong === n) document.getElementById('lvPlayBtn').classList.add('playing'); });
  a.addEventListener('pause', () => { if (lyricsViewSong === n) document.getElementById('lvPlayBtn').classList.remove('playing'); });
  a.addEventListener('ended', () => {
    document.querySelector(`#player${n} .play-btn`).classList.remove('playing');
    if (current === n) current = null;
    if (lyricsViewSong === n) document.getElementById('lvPlayBtn').classList.remove('playing');
  });
});

const EQ_BAR_COUNT = 7;

// ── Web Audio graph (disabled — playback uses native <audio> output) ──
let audioCtx = null;
function initAudioGraph() { /* no-op */ }
function ensureAudioRunning() { return Promise.resolve(); }

// ── EQ bar state (one entry per song), populated into the in-page #eq${n} divs ──
const eqState = {};
[1, 2, 3].forEach(n => {
  const host = document.getElementById(`eq${n}`);
  const bars = [];
  for (let i = 0; i < EQ_BAR_COUNT; i++) {
    const b = document.createElement('div');
    b.className = 'eq-bar';
    host.appendChild(b);
    bars.push(b);
  }
  eqState[n] = { host, bars };
  // Reveal bars with fade-in
  requestAnimationFrame(() => host.classList.add('visible'));
});

// ── EQ rendering loop (single global rAF, sine-wave fallback) ──
function eqTick(ts) {
  for (let n = 1; n <= 3; n++) {
    const state = eqState[n];
    if (!state) continue;
    const audio = audios[n];
    if (audio.paused) {
      state.bars.forEach(b => b.style.transform = 'scaleY(0.1)');
      continue;
    }
    for (let i = 0; i < EQ_BAR_COUNT; i++) {
      const v = 0.2 + 0.4 * Math.abs(Math.sin(ts * 0.004 + i * 0.6));
      state.bars[i].style.transform = `scaleY(${v})`;
    }
  }
  requestAnimationFrame(eqTick);
}
requestAnimationFrame(eqTick);

// ════ LYRICS VIEW OVERLAY ════
let lyricsViewSong = null;
const lvEl     = document.getElementById('lyrics-view');
const lvTitle  = document.getElementById('lvTitle');
const lvBody   = document.getElementById('lvBody');
const lvPlayBtn= document.getElementById('lvPlayBtn');
const lvBar    = document.getElementById('lvBar');
const lvFill   = document.getElementById('lvFill');
const lvHandle = document.getElementById('lvHandle');
const lvCur    = document.getElementById('lvCur');
const lvDur    = document.getElementById('lvDur');

function openLyricsView(n) {
  lyricsViewSong = n;
  lvTitle.textContent = TRACK_TITLES[n] || '—';
  lvBody.textContent  = LYRICS_TEXT[n]  || '';
  lvBody.scrollTop = 0;
  lvEl.classList.add('open');
  lvEl.setAttribute('aria-hidden', 'false');
  setCatVisible(false);
  // Reflect current audio state on the mini-player
  const a = audios[n];
  lvPlayBtn.classList.toggle('playing', !a.paused);
  syncLyricsViewPlayer();
}

function closeLyricsView() {
  lvEl.classList.remove('open');
  lvEl.setAttribute('aria-hidden', 'true');
  lyricsViewSong = null;
  setCatVisible(true);
}

function syncLyricsViewPlayer() {
  if (lyricsViewSong === null) return;
  const a = audios[lyricsViewSong];
  const p = a.duration ? (a.currentTime / a.duration) * 100 : 0;
  lvFill.style.width = p + '%';
  lvHandle.style.left = p + '%';
  lvCur.textContent = fmt(a.currentTime);
  lvDur.textContent = fmt(a.duration);
}

function lvTogglePlay() {
  if (lyricsViewSong === null) return;
  togglePlay(lyricsViewSong);
}

// lv-bar scrub (same pattern as #bar${n})
(function () {
  let sk = false;
  const seek = cx => {
    if (lyricsViewSong === null) return;
    const a = audios[lyricsViewSong];
    const r = lvBar.getBoundingClientRect();
    if (a.duration) a.currentTime = Math.min(Math.max((cx - r.left) / r.width, 0), 1) * a.duration;
  };
  lvBar.addEventListener('pointerdown', e => {
    sk = true; lvBar.setPointerCapture(e.pointerId);
    lvHandle.style.opacity = '1';
    seek(e.clientX);
  });
  lvBar.addEventListener('pointermove', e => { if (sk) seek(e.clientX); });
  lvBar.addEventListener('pointerup', e => { if (!sk) return; sk = false; lvHandle.style.opacity = ''; seek(e.clientX); });
  lvBar.addEventListener('pointercancel', () => { sk = false; lvHandle.style.opacity = ''; });
})();

// ════ DICE, DIAMONDS & LADYBUGS ════

// ── Diamonds — d1 every 2s, d2 every 5s, both launched at t=0 so they sync every 10s ──
const dm1El = document.getElementById('diamond1');
const dm2El = document.getElementById('diamond2');
function flashDiamond(el) {
  el.style.setProperty('--dm-color', 'rgba(0,245,212,0.7)');
  el.style.setProperty('--dm-glow', 'rgba(0,245,212,0.5)');
  el.classList.add('flash');
  setTimeout(() => {
    el.classList.remove('flash');
    el.style.setProperty('--dm-color', 'rgba(255,45,120,0.5)');
    el.style.setProperty('--dm-glow', 'rgba(255,45,120,0.25)');
  }, 1200);
}
// Fire at t=0 so both cycles are phase-aligned — LCM(2,5)=10 → they re-align every 10s
flashDiamond(dm1El);
flashDiamond(dm2El);
setInterval(() => flashDiamond(dm1El), 2000);
setInterval(() => flashDiamond(dm2El), 5000);

// ── Dice — 4-roll cycle: 3 random faces, then B+M, repeat forever ──
const d1El = document.getElementById('die1'), d2El = document.getElementById('die2');
const v1 = document.getElementById('dieVal1'), v2 = document.getElementById('dieVal2');
const faces = ['1', '2', '3', '4', '5', '6'];
let rc = 0;

function rollDice() {
  rc++;
  const isSpecial = rc % 4 === 0; // every 4th roll → B + M
  d1El.classList.remove('rolling', 'special');
  d2El.classList.remove('rolling', 'special');
  void d1El.offsetWidth; void d2El.offsetWidth;
  d1El.classList.add('rolling');
  d2El.classList.add('rolling');
  setTimeout(() => {
    if (isSpecial) {
      v1.textContent = 'B';
      v2.textContent = 'M';
      d1El.classList.add('special');
      d2El.classList.add('special');
    } else {
      v1.textContent = faces[Math.floor(Math.random() * 6)];
      v2.textContent = faces[Math.floor(Math.random() * 6)];
    }
  }, 200);
}
rollDice();
setInterval(rollDice, 2000);

// ── Ladybugs — alternating flash, one at a time every 1.5s ──
// lb1 at t=0, lb2 at t=1.5, lb1 at t=3, lb2 at t=4.5, ...
// Each individual bug has a 3s cycle; the 1.5s phase offset means exactly one
// bug is lit at any given moment.
const lb1El = document.getElementById('swirl1');
const lb2El = document.getElementById('swirl2');
function flashLadybug(el) {
  el.style.setProperty('--sw-color', 'rgba(0,245,212,0.7)');
  el.style.setProperty('--sw-glow', 'rgba(0,245,212,0.5)');
  el.classList.add('flash');
  setTimeout(() => {
    el.classList.remove('flash');
    el.style.setProperty('--sw-color', 'rgba(255,45,120,0.55)');
    el.style.setProperty('--sw-glow', 'rgba(255,45,120,0.3)');
  }, 700);
}
let lbTurn = 0; // 0 → lb1 next, 1 → lb2 next
function tickLadybug() {
  flashLadybug(lbTurn === 0 ? lb1El : lb2El);
  lbTurn = 1 - lbTurn;
}
tickLadybug(); // immediate flash of lb1 at t=0
setInterval(tickLadybug, 1500);
